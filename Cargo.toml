[package]
name = "git-wrapper"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "A comprehensive Rust wrapper for Git CLI operations"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourusername/git-wrapper"
keywords = ["git", "wrapper", "cli", "vcs"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"], optional = true }
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
colored = "2.1"

[[bin]]
name = "gitw"
path = "src/main.rs"

[features]
default = []
serde = ["dep:serde"]

[dev-dependencies]
tempfile = "3.8"
